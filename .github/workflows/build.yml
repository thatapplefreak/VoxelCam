name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Java 21 is what Minecraft 1.21.11 runs on. Building on a newer JDK would
      # still compile (options.release pins the bytecode), but building on the
      # target runtime keeps CI honest about what players actually have.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build --stacktrace

      # Guards the mistake that shipped in the first 2.0.0: a jar compiled to a
      # class version no stock Minecraft install can load.
      - name: Verify bytecode targets Java 21
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -1)
          unzip -o -q "$jar" 'com/thatapplefreak/voxelcam/client/VoxelCamClient.class' -d /tmp/verify
          major=$(javap -v /tmp/verify/com/thatapplefreak/voxelcam/client/VoxelCamClient.class | grep -oE 'major version: [0-9]+' | grep -oE '[0-9]+')
          echo "class file major version: $major"
          if [ "$major" != "65" ]; then
            echo "::error::Expected major version 65 (Java 21), got $major"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: voxelcam-jar
          path: build/libs/*.jar
