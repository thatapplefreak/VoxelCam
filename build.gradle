plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		voxelcam {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration()

	// Creates the gametest source set and the runClientGameTest task. The mod id is
	// the test mod's own, deliberately not voxelcam's.
	configureTests {
		createSourceSet = true
		modId = "voxelcam-gametest"
	}
}

loom {
	runs {
		clientGameTest {
			// CI runners are slow enough that the game test network synchronizer can
			// time out; upstream's advice is to turn it off there. Left on locally,
			// where it is what keeps the tests deterministic.
			if (System.getenv("CI") != null) {
				vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
			}
		}
	}
}

// splitEnvironmentSourceSets() leaves `test` extending `main`, which holds only
// resources — without this the tests cannot see a single class they are testing.
sourceSets {
	test {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Not bundled in fabric-api, so it is pinned separately. The +515ac5339e build
	// suffix is the same one 26.2's bundled modules carry.
	gametestImplementation "net.fabricmc.fabric-api:fabric-client-gametest-api-v1:${project.client_gametest_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

// LGPL requires anyone who receives the jar to receive the licence with it.
tasks.named('jar') {
	from(rootProject.file('COPYING')) { into 'META-INF' }
	from(rootProject.file('COPYING.LESSER')) { into 'META-INF' }
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
